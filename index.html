  <header class="top"><div><div class="brand">ORBITAL SALVAGE</div><div class="subtitle"><span id="chapterFourSubtitle"></span></div></div><div class="tools"><button class="btn" id="hintBtn">ヒント</button><button class="btn" id="journalBtn">調査記録</button></div></header>
  <div class="layout">
    <section class="screenframe" aria-label="探索画面"><div class="location"><span>LOCATION 02 / 都市衛星 居住リング跡</span><strong>探索中 · 船外活動</strong></div><div class="explore-toolbar"><span class="explore-note">ホイール・ピンチで拡大 / 拡大中はドラッグで移動</span><small class="chapter4-scan-mode">TRACE CORRELATION / 痕跡照合</small><button id="resetView" type="button">表示を戻す</button><button id="nanaScanner" type="button" aria-pressed="false">スキャン</button><button id="memoryPuzzleButton" class="memory-trigger" type="button">記憶の照合：断片 0/3</button></div><div class="explore-viewport" id="exploreViewport"><div class="scene" id="scene"></div></div>
      <section class="dialogue" aria-live="polite"><div class="portrait" id="speakerIcon">E</div><div><strong id="speaker">エステバン</strong><p id="line">「……居住区の残骸だ。リストの物を探すぞ」</p><button class="dialogue-next" id="dialogueNext" title="次のセリフへ" aria-label="次のセリフへ" hidden>▶</button></div></section>
    </section>
    <aside class="side"><section class="panel"><h2>RECOVERY ORDER / 回収依頼</h2><p>廃棄された都市衛星の居住区から、生活用品を回収する。</p><div class="progress"><i id="progressBar" style="width:0%"></i></div><p id="goalText">回収 0 / 3</p><div style="margin-top:13px"><button class="btn primary" id="returnBtn" disabled>帰還する</button></div></section><section class="panel"><h2>CARGO / 回収袋</h2><div class="inventory" id="inventory"><div class="slot">＋</div><div class="slot">＋</div><div class="slot">＋</div></div></section><section class="panel"><h2>SCAN LOG / 調査状況</h2><div class="notebook" id="scanLog">気になる物をクリックして調べよう。</div></section></aside>
  </div>
</main>
<div id="storyRoot" class="story-root" hidden></div>
<div class="modal" id="modal" hidden><div class="modalbox" id="modalBody"></div></div>
<script src="./chapter-display.js"></script>
<script src="./flow.js"></script>
<script src="./game-sfx.js"></script>
<script src="./chapter4-bgm.js"></script>
<script src="./game-menu.js?v=94"></script>
<script src="./exploration-enhancements.js"></script>
<script src="./clue-link-puzzle.js"></script>
<script>
  'use strict';
  const scene=document.getElementById('scene'),modal=document.getElementById('modal'),modalBody=document.getElementById('modalBody');
  const items=[
    {id:'locker',name:'建付けの悪い収納庫',symbol:'',x:77,y:35,w:15,h:35,rot:'0deg',kind:'zoom',important:true},
    {id:'cup',name:'ひびの入ったマグカップ',symbol:'',x:12,y:39,w:6,h:12,rot:'-5deg',kind:'story',dialogue:[['ナナ','「ここで、誰かが飲み物を飲んでいたの？」'],['エステバン','「……ああ。大した物じゃねぇがな」']]},
    {id:'drawing',name:'壁の子供の落書き',symbol:'',x:37,y:22,w:9,h:20,rot:'0deg',kind:'story',dialogue:[['ナナ','「家族の絵……かな」'],['エステバン','「……さあな。余計なこと考えずに手を動かせ」']]},
    {id:'vase',name:'欠けた花瓶',symbol:'',x:84,y:81,w:10,h:15,rot:'-12deg',kind:'story',dialogue:[['ナナ','「……これは、何を入れていたの？」'],['エステバン','「花だろうよ。今じゃ欠けた容器だ」'],['ナナ','「……それでも、きれいな模様だね」']]},
    {id:'frame',name:'割れた写真立て',symbol:'',x:9.7,y:69,w:11,h:20,rot:'-12deg',kind:'flavor',line:'割れたガラスに、居住区の冷たい光が反射している。'},
    {id:'dish',name:'食器の束',symbol:'',x:24,y:53,w:13,h:20,rot:'0deg',kind:'collect',line:'まだ使えそうな食器だ。丁寧に回収する。',cargo:'食器',cargoIcon:'◉'},
    {id:'light',name:'照明モジュール',symbol:'',x:84,y:14,w:10,h:17,rot:'-20deg',kind:'collect',line:'照明モジュール。壁から外して回収できそうだ。',cargo:'照明',cargoIcon:'✦'},
    {id:'music',name:'小型音楽プレイヤー',symbol:'',x:47,y:82,w:6,h:10,rot:'-30deg',kind:'flavor',line:'小型の音楽プレイヤーのようだ。充電は切れている。'},
    {id:'poster',name:'古い金属容器',symbol:'',x:39.7,y:76,w:5.5,h:10,rot:'-5deg',kind:'flavor',line:'古い金属容器。使い込まれた日用品らしい。'},
    {id:'fabric',name:'漂う布',symbol:'',x:81,y:73,w:16,h:15,rot:'-12deg',kind:'flavor',line:'薄い布地が破損した家具に絡んでいる。回収対象ではない。'},
    {id:'pipe',name:'剥き出しの配線',symbol:'',x:67,y:10,w:15,h:15,rot:'12deg',kind:'flavor',line:'配線が天井から垂れ下がっている。通電しているかは不明だ。'}
  ];
  const seen=new Set(),collected=new Set(),memoryClues=new Set();let doorOpened=false,teddyFound=false,hintStage=0,finished=false,missionNotified=false,memorySolved=false,memoryHintLevel=0;
  let memoryDraft={mirror:false,order:['','','']};
  let memoryPuzzle=null;
  const saveChapterFour=()=>window.storyGame?.saveProgress('chapter4');
  const byId=id=>document.getElementById(id);
  let speechQueue=[];
  function showSpeech(who,message){const isCharacter=who==='ナナ'||who==='エステバン';byId('speaker').textContent=isCharacter?who:'';byId('speaker').hidden=!isCharacter;const portrait=byId('speakerIcon');portrait.className='portrait'+(who==='ナナ'?' nana':who==='エステバン'?'':' neutral');portrait.textContent='';portrait.setAttribute('aria-label',isCharacter?who+'の顔絵':'スキャン情報');byId('line').textContent=message;byId('dialogueNext').hidden=speechQueue.length===0;}
  function converse(lines){speechQueue=lines.slice(1);showSpeech(...lines[0]);}
  function say(who,message){converse([[who,message]]);}
  byId('dialogueNext').onclick=()=>{if(speechQueue.length)showSpeech(...speechQueue.shift());};
  const itemImages={dish:'item-dishes.webp',light:'item-light.webp',teddy:'item-teddy.webp'};
  function update(){const count=collected.size;byId('goalText').textContent=`回収 ${count} / 3`;byId('progressBar').style.width=`${count/3*100}%`;byId('returnBtn').disabled=count<3;byId('inventory').innerHTML=[...collected].map(id=>{let it=items.find(x=>x.id===id);const name=it?it.cargo:'熊のぬいぐるみ';return `<div class="slot" title="${name}"><img src="./${itemImages[id]}" alt="${name}"><small>${it?it.cargo:'ぬいぐるみ'}</small></div>`}).join('')+Array.from({length:3-count},()=>'<div class="slot">＋</div>').join('');byId('scanLog').innerHTML=`調査した箇所：${seen.size} / ${items.length}<br>回収した物：${count}点<br>${teddyFound?'熊のぬいぐるみを発見済み':'収納の奥にも何かありそうだ'}`;document.querySelectorAll('.hotspot').forEach(el=>{el.classList.toggle('seen',seen.has(el.dataset.id));el.classList.toggle('recovered',collected.has(el.dataset.id));});}
  function close(){modal.hidden=true;modalBody.replaceChildren();}
  function playCompletionTone(){try{const settings=window.storyGame?.readSettings?.()||{},level=settings.mute?0:.055*(settings.master??100)/100*(settings.effects??100)/100;if(level<=0)return;const Type=window.AudioContext||window.webkitAudioContext;if(!Type)return;const audio=new Type();audio.resume();const t=audio.currentTime;[520,780].forEach((frequency,i)=>{const oscillator=audio.createOscillator(),volume=audio.createGain();oscillator.type='sine';oscillator.frequency.value=frequency;volume.gain.setValueAtTime(.0001,t+i*.13);volume.gain.exponentialRampToValueAtTime(Math.max(.0001,level),t+i*.13+.015);volume.gain.exponentialRampToValueAtTime(.0001,t+i*.13+.16);oscillator.connect(volume);volume.connect(audio.destination);oscillator.start(t+i*.13);oscillator.stop(t+i*.13+.18);});setTimeout(()=>audio.close(),700);}catch(_){}}
  function checkChapterFourComplete(){if(collected.size!==3||missionNotified)return;missionNotified=true;playCompletionTone();const toast=document.createElement('div');toast.className='ch4-mission-notice';toast.setAttribute('role','status');toast.innerHTML='<strong>RECOVERY COMPLETE</strong><span>回収確認 3 / 3 — 帰還できます</span>';byId('gameApp').append(toast);byId('goalText').classList.add('recovery-flash');setTimeout(()=>{toast.remove();byId('goalText').classList.remove('recovery-flash');},1700);}
  function show(html,variant=''){modalBody.className='modalbox'+(variant==='command'?' hud-command':variant==='event'?' event-modal':'');modalBody.innerHTML=html;modal.hidden=false;const closeButton=modalBody.querySelector('[data-close]');if(closeButton)closeButton.focus();}
  function noteMemoryClue(id){if(!['drawing','frame','music'].includes(id)||memoryClues.has(id))return;window.gameSfx?.play('clue');memoryClues.add(id);memoryPuzzle?.update();const note=document.createElement('div');note.className='memory-observation';note.textContent=`MEMORY TRACE ${memoryClues.size}/3${memoryClues.size===3?' / 照合可能':''}`;byId('exploreViewport').append(note);setTimeout(()=>note.remove(),1500);saveChapterFour();}
  function inspect(item){
    window.gameSfx?.play(item.id==='music'?'device':item.id==='frame'?'glass':'touch');
    // 帰還済みの旧セーブでも任意の調査・記憶照合は継続できる。
    // 回収品や収納庫の進行状態だけは、帰還後に変更させない。
    if(finished && (item.kind==='collect'||item.kind==='zoom'))return;
    seen.add(item.id);
    noteMemoryClue(item.id);
    update();saveChapterFour();
    if(item.kind==='zoom'){openLocker();return;}
    if(item.kind==='story'){converse(item.dialogue);return;}
    if(item.kind==='flavor'){say('調査',item.line);return;}
    if(item.kind==='collect'){if(collected.has(item.id)){say('調査','これはもう回収した。');return;}show(`<div class="eyebrow">SALVAGE / 調査</div><h3>${item.name}</h3><img class="pickup-image" src="./${itemImages[item.id]}" alt="${item.name}"><p>${item.line}</p><div class="modalactions"><button class="btn" data-close>戻る</button><button class="btn primary" id="collectBtn">回収する</button></div>`);modalBody.querySelector('[data-close]').onclick=close;byId('collectBtn').onclick=()=>{collected.add(item.id);close();say('エステバン',`「${item.cargo}、確保。次だ」`);update();checkChapterFourComplete();saveChapterFour();};}
  }
  function openLocker(){const hasTeddy=collected.has('teddy');show(`<div class="eyebrow">DETAIL SCAN / 詳細調査</div><h3>建付けの悪い収納庫</h3><p id="zoomNarration">${doorOpened?(hasTeddy?'ぬいぐるみは回収済みだ。収納庫には古い衣類や生活用品が残っている。':'引き戸が開いた。棚の奥に何か見える。'):'引き戸が歪み、レールに引っかかっている。黒い取っ手を引いてみよう。'}</p><div class="zoom ${doorOpened?'opened':''}${hasTeddy?' teddy-recovered':''}">${doorOpened?(hasTeddy?'':'<button class="teddy-hotspot" id="teddyTarget" aria-label="棚の熊のぬいぐるみを調べる" title="熊のぬいぐるみ"></button>'):'<button class="door-handle" id="doorHandle" aria-label="引き戸の取っ手を調べる" title="取っ手"></button>'}</div><p class="zoomcaption">${hasTeddy?'この棚のぬいぐるみは回収済みだ。':doorOpened?'棚の奥のぬいぐるみを調べよう。':'黒い取っ手、または下の操作ボタンから調べられます。'}</p><div class="modalactions"><button class="btn" data-close>探索画面へ</button>${doorOpened?'':'<button class="btn primary" id="openDoor">引き戸をこじ開ける</button>'}</div>`);modalBody.querySelector('[data-close]').onclick=close;if(!doorOpened){const open=()=>{doorOpened=true;saveChapterFour();say('エステバン','「……レールが歪んでやがる。……よし、開いたぞ。奥を見ろ」');openLocker()};byId('openDoor').onclick=open;byId('doorHandle').onclick=open;}else if(!hasTeddy)byId('teddyTarget').onclick=inspectTeddy;}
  function inspectTeddy(){teddyFound=true;saveChapterFour();show(`<div class="eyebrow">DISCOVERY / 発見</div><h3>片目のない熊のぬいぐるみ</h3><div class="event-stage"><img src="./event-nana-teddy.webp" alt="ナナが片目のない熊のぬいぐるみを両手に持ち、見つめている"><div class="event-subtitle"><strong>ナナ</strong>「……可愛い、対象。」</div></div><p>片方の目が取れ、綿が少し覗いている。ナナは壊れ物を扱うように、そっと手を伸ばす。</p><div class="modalactions"><button class="btn" id="teddyBack">戻る</button><button class="btn primary" id="teddyCollect">丁寧に回収する</button></div>`,'event');byId('teddyBack').onclick=openLocker;byId('teddyCollect').onclick=()=>{collected.add('teddy');close();converse([['エステバン','「リストにあるなら持ってけ。綿は落とすな、フィルタが詰まる」'],['ナナ','「了解。」']]);update();checkChapterFourComplete();saveChapterFour();};}
  function returnHome(){if(collected.size<3||finished)return;finished=true;close();saveChapterFour();window.storyGame.afterChapterFour();}
  function render(){items.forEach(it=>{let el=document.createElement('button');el.className='hotspot'+(it.important?' important':'')+(it.x<18?' edge-left':'')+(it.x>82?' edge-right':'')+(it.y<19?' edge-top':'');el.dataset.id=it.id;el.setAttribute('aria-label',it.name);el.style.cssText=`left:${it.x}%;top:${it.y}%;width:${it.w}%;height:${it.h}%;--rot:${it.rot}`;el.innerHTML=`<span class="tag">${it.name}</span><span class="object" aria-hidden="true">${it.symbol}</span>`;el.onclick=()=>inspect(it);scene.append(el);});update();}
  byId('hintBtn').onclick=()=>{hintStage=Math.min(hintStage+1,3);let message;if(collected.size===3)message='必要な回収品が揃ったよ。「帰還する」を選ぼう。';else if(hintStage===1)message='……生活用品の痕跡は、棚や収納の周りに残っているかもしれない。';else if(hintStage===2)message=!collected.has('teddy')?'収納庫の引き戸が気になるね。開けられる場所を探してみよう。':'回収依頼と調査済みの物を比べて、まだ手に入れていないものを探そう。';else if(!collected.has('teddy'))message=!doorOpened?'右側の収納庫を調べよう。引き戸には取っ手があるみたい。':'収納庫の奥に片目のない熊のぬいぐるみが見えるよ。';else if(!collected.has('dish')&&!collected.has('light'))message='食器は左手前、照明モジュールは右上に残っているよ。';else if(!collected.has('dish'))message='残りは食器。左手前の棚を調べよう。';else message='残りは照明モジュール。右上の装置を調べよう。';show(`<div class="hud-heading"><span>EVA SUPPORT / 任務支援回線</span><span class="hud-online">● LINK ACTIVE</span></div><h3>探索支援データ</h3><div class="hud-stat">GUIDANCE ${hintStage}/3　　SOURCE : SCAN</div><div class="hud-readout"><p>${message}</p></div><div class="modalactions"><button class="btn primary" data-close>探索へ戻る</button></div>`,'command');modalBody.querySelector('[data-close]').onclick=close;saveChapterFour();};
  byId('journalBtn').onclick=()=>{const found=items.filter(x=>seen.has(x.id));const cargo=[...collected].map(x=>x==='teddy'?'熊のぬいぐるみ':items.find(it=>it.id===x).cargo);show(`<div class="hud-heading"><span>SCANNER / 調査アーカイブ</span><span class="hud-online">● DATA SYNC</span></div><h3>探索スキャンログ</h3><div class="hud-stat">TRACE ANALYSIS / 痕跡の関連づけ</div><div class="hud-stat">SURVEY ${String(seen.size).padStart(2,'0')} / ${String(items.length).padStart(2,'0')}　　RECOVERED ${String(collected.size).padStart(2,'0')}</div><div class="hud-readout"><p>調査済みの対象</p>${found.length?`<ul class="hud-list">${found.map(x=>`<li>${x.name}</li>`).join('')}</ul>`:'<p>記録された調査対象はありません。</p>'}</div><div class="hud-stat">CARGO / ${cargo.join('、')||'回収品なし'}</div><div class="hud-stat">TRACE LINK / 記憶の照合 ${memoryClues.size}/3 ・ ${memorySolved?'解析済み':'未完了'}</div>${memorySolved?memoryPuzzle?.finishedRecord?.()||'':''}<div class="modalactions"><button class="btn primary" data-close>探索へ戻る</button></div>`,'command');modalBody.querySelector('[data-close]').onclick=close;};
  byId('returnBtn').onclick=returnHome;modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)close()});
  render();
  const explorationCamera=window.ExplorationEnhancements.mount({
    viewport:byId('exploreViewport'),scene,scanButton:byId('nanaScanner'),resetButton:byId('resetView'),
    onScan:()=>{const unvisited=items.filter(it=>!seen.has(it.id));const important=unvisited.some(it=>it.important);say('ナナ',important?'「……少し強い反応がある。あの辺り、まだ調べられそうだよ。」':unvisited.length?'「……微弱な反応を検出。まだ調べていない物があるよ。」':'「……この区画の反応は、ひととおり記録できたみたい。」');}
  });
  memoryPuzzle=window.ClueLinkPuzzle.create({
    trigger:byId('memoryPuzzleButton'),title:'残された記憶の照合',
    sources:[
      {id:'drawing',title:'落書き / 記号の輪郭',clue:'ナナの輪郭復元：星＝点の痕、家＝直線の痕、熊＝波の痕。\n元の落書きが鮮明なわけではなく、残留パターンの仮分類。'},
      {id:'frame',title:'割れた写真立て / 位置の関係',clue:'破片に残った微弱な痕跡を左から読むと「星・家・熊」。ただし割れたガラスの反射で左右が逆に見えている可能性がある。'},
      {id:'music',title:'音楽プレイヤー / 時間の流れ',clue:'保存された短い波形の順序は「波 → 直線 → 点」。ナナの分類と照らせば、像が正しい向きか判断できそうだ。'},
    ],
    hints:[
      '落書きに復元された記号には、それぞれ違う線の特徴がある。音の記録も線の種類として読み替えてみよう。',
      '写真立ては割れたガラスだ。左右の並びが鏡のように反転している可能性を考えてみよう。',
      '音楽プレイヤーの記録は「波 → 直線 → 点」。落書きの記号に置き換え、写真の向きの補正結果と照らし合わせよう。',
    ],
    solution:['bear','house','star'],
    reward:'ナナの解析ログ：別々の品に残った痕跡が、共通の並びを示していた。誰が残したものかは分からない。それでも、ただの偶然ではないのかもしれない。',
    hasClue:id=>memoryClues.has(id),isSolved:()=>memorySolved,
    getHintLevel:()=>memoryHintLevel,setHintLevel:n=>{memoryHintLevel=n;saveChapterFour();},
    shortEffects:()=>!!window.storyGame?.readSettings?.().shortEffects,
    getDraft:()=>({mirror:memoryDraft.mirror,order:[...memoryDraft.order]}),
    setDraft:draft=>{memoryDraft={mirror:!!draft.mirror,order:[...draft.order]};saveChapterFour();},
    onSolved:()=>{
      if(memorySolved)return;
      memorySolved=true;saveChapterFour();
      converse([
        ['ナナ','「……別々のものだと思ってたけど、同じ形が残ってる。ここにいた人たちにとって、何か意味があったのかな。」'],
        ['エステバン','「……さあな。今となっちゃ確かめようもねえ。だが、何も考えずに残したってわけじゃなさそうだな。」'],
      ]);
    },
    openModal:html=>show(html,'command'),closeModal:close,
  });
  window.chapterFourSave={
    snapshot:()=>({seen:[...seen],collected:[...collected],doorOpened,teddyFound,hintStage,finished,missionNotified,memoryClues:[...memoryClues],memorySolved,memoryHintLevel,memoryDraft}),
    restore:data=>{if(!data)return;seen.clear();collected.clear();memoryClues.clear();(data.seen||[]).forEach(x=>seen.add(x));(data.collected||[]).forEach(x=>collected.add(x));(data.memoryClues||[]).forEach(x=>memoryClues.add(x));['drawing','frame','music'].forEach(x=>{if(seen.has(x))memoryClues.add(x)});doorOpened=!!data.doorOpened;teddyFound=!!data.teddyFound;hintStage=data.hintStage||0;finished=!!data.finished;missionNotified=!!data.missionNotified;memorySolved=!!data.memorySolved;memoryHintLevel=Math.min(3,data.memoryHintLevel||0);memoryDraft=data.memoryDraft?.order?.length===3?{mirror:!!data.memoryDraft.mirror,order:[...data.memoryDraft.order]}:{mirror:false,order:['','','']};update();memoryPuzzle?.update();}
  };
  document.getElementById('chapterFourSubtitle').textContent = window.chapterDisplay.name('chapter4');
  window.startChapterFour=()=>{show(`<div class="eyebrow">${window.chapterDisplay.english('chapter4')} / ${window.chapterDisplay.japanese('chapter4')}</div><h1>忘れられた居住区</h1><p>廃棄された都市衛星。かつての暮らしの痕跡から、再利用できる生活用品を回収する。</p><div class="secret"><strong>今回の作業</strong><p>食器・照明モジュールを探す。収納庫にも何か残っているようだ。</p></div><p>画像の中をクリックして物品を調査してください。</p><div class="modalactions"><button class="btn primary" data-close>探索を開始する</button></div>`);modalBody.querySelector('[data-close]').onclick=close;};
  window.storyGame.start();
</script>
</body>
</html>
